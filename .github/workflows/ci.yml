name: CI

on:
  push:
    branches: [master, 'cursor/**']
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Prefer headless OpenCV in CI (GUI libs not needed)
          pip install --upgrade opencv-python-headless flask numpy Pillow mediapipe || true
      - name: Run unit suite
        run: python run_all_tests.py --unit
      - name: Mock dual-camera soak
        run: python scripts/dual_camera_soak.py --mock

  maintainability:
    name: Maintainability ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ratchet tools
        run: python -m pip install ruff lizard pytest
      - name: Clean as You Code (diff-scoped ruff; eslint only if configured)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_diff_lint.py --base "origin/${{ github.base_ref }}"
      - name: Hotspot gate
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_hotspots.py --base "origin/${{ github.base_ref }}"
      - name: Ruff baseline (do not rewrite)
        run: python scripts/check_ruff_baseline.py
      - name: Unit path does not open a camera
        run: python -m pytest -q tests/test_unit_path_camera_free.py

  mutation:
    name: Mutation ceiling (src/swing_score.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade opencv-python-headless 'mutmut==3.8.0'
      - name: Mutation score against the committed ceiling
        run: |
          python -m mutmut run --max-children 1
          python -m mutmut export-cicd-stats
          python scripts/check_mutation_ceiling.py

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade opencv-python-headless || true
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: 'true'
